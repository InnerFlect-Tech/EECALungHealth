name: Deploy — eecalunghealth.com

# Deploys automatically on every push to main that touches the site, and can
# still be run by hand: gh workflow run deploy.yml --ref main
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy.yml']

concurrency:
  group: deploy-eecalunghealth
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Build also prerenders every public page (scripts/prerender.mjs) so
      # crawlers and AI tools that don't run JavaScript see the content.
      - name: Build (web/)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Deploy web/dist via rsync over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # No --delete: never risk removing server-only files (uploads, config).
          # Explicit excludes protect runtime config + user uploads regardless.
          rsync -avz \
            --exclude 'api/config.php' \
            --exclude 'api/uploads/' \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT}" \
            web/dist/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"

      - name: Smoke test live site (no-JS fetch, like ChatGPT)
        working-directory: web
        run: |
          sleep 10
          scripts/smoke-test.sh https://eecalunghealth.com
